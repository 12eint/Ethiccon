<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Kayıt Portalı | Ethiccon</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
        }
        
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            overflow: hidden;
            margin: 20px;
        }

        .header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 40px 32px;
            text-align: center;
            color: white;
        }

        .header h1 { margin: 0 0 8px 0; font-size: 1.75rem; font-weight: 800; letter-spacing: -0.5px; }
        .header p { margin: 0; color: #94a3b8; font-size: 0.95rem; }

        .form-body {
            padding: 32px;
        }

        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.875rem; }
        
        .form-input, .form-select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.2s;
            outline: none;
        }
        
        .form-input:focus, .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        
        .btn:hover { background: var(--primary-hover); }

        .success-state {
            display: none;
            padding: 48px 32px;
            text-align: center;
        }
        .success-state svg { color: #10b981; width: 64px; height: 64px; margin-bottom: 24px; }
        .success-state h2 { font-size: 1.5rem; margin-bottom: 12px; }
        .success-state p { color: var(--text-muted); line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <div id="formSection">
        <div class="header">
            <h1>Etkinlik Kayıt Sistemi</h1>
            <p>Lütfen katılmak istediğiniz etkinliği seçin ve formu eksiksiz doldurun.</p>
        </div>
        
        <div class="form-body">
            <form id="publicRegForm">
                <div class="form-group">
                    <label class="form-label">Etkinlik Seçin *</label>
                    <select id="prEvent" class="form-select" required>
                        <option value="">Yükleniyor...</option>
                    </select>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label">Adınız *</label>
                        <input type="text" id="prName" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Soyadınız *</label>
                        <input type="text" id="prSurname" class="form-input" required>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label">TC Kimlik No / Pasaport</label>
                        <input type="text" id="prTc" class="form-input">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Telefon *</label>
                        <input type="tel" id="prPhone" class="form-input" required placeholder="05XX XXX XX XX">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">E-Posta Adresiniz *</label>
                    <input type="email" id="prEmail" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Kurum / Firma</label>
                    <input type="text" id="prCompany" class="form-input" placeholder="Çalıştığınız kurum">
                </div>

                <div style="margin-top: 32px;">
                    <button type="submit" class="btn">
                        <i data-lucide="check-circle"></i> Kaydımı Tamamla
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="successSection" class="success-state">
        <i data-lucide="check-circle-2"></i>
        <h2>Kayıt Başarılı!</h2>
        <p>Kaydınız sistemimize başarıyla ulaştı. Detaylı bilgilendirme ve ödeme adımları için organizasyon komitesi sizinle e-posta üzerinden iletişime geçecektir.</p>
    </div>
</div>

<script>
    lucide.createIcons();

    // Load events from LocalStorage
    document.addEventListener('DOMContentLoaded', () => {
        const events = JSON.parse(localStorage.getItem('ethiccon_events') || '[]');
        const eventSelect = document.getElementById('prEvent');
        
        // Filter future events
        const now = new Date();
        now.setHours(0,0,0,0);
        const activeEvents = events.filter(e => new Date(e.endDate) >= now).sort((a,b) => new Date(a.startDate) - new Date(b.startDate));
        
        if (activeEvents.length > 0) {
            eventSelect.innerHTML = '<option value="">Lütfen etkinlik seçin...</option>' + 
                activeEvents.map(e => `<option value="${e.id}">${e.name} (${e.city})</option>`).join('');
        } else {
            eventSelect.innerHTML = '<option value="">Şu anda aktif bir etkinlik bulunmuyor.</option>';
            document.querySelector('.btn').disabled = true;
        }

        // Phone mask
        document.getElementById('prPhone').addEventListener('input', (e) => {
            let val = e.target.value.replace(/\D/g, '');
            if (val.length > 0 && val[0] !== '0') val = '0' + val;
            if (val.length > 11) val = val.substring(0, 11);
            e.target.value = val;
        });
    });

    document.getElementById('publicRegForm').addEventListener('submit', (e) => {
        e.preventDefault();
        
        const eventId = document.getElementById('prEvent').value;
        if (!eventId) return;

        const pData = {
            id: crypto.randomUUID(),
            eventId: eventId,
            firstName: document.getElementById('prName').value.trim(),
            lastName: document.getElementById('prSurname').value.trim(),
            tc: document.getElementById('prTc').value.trim(),
            phone: document.getElementById('prPhone').value.trim(),
            email: document.getElementById('prEmail').value.trim(),
            company: document.getElementById('prCompany').value.trim() || 'Bireysel',
            accommodation: false,
            createdAt: new Date().toISOString(),
            source: 'Portal' // To distinguish self-registered
        };

        // Save to DB
        const participants = JSON.parse(localStorage.getItem('ethiccon_participants') || '[]');
        participants.push(pData);
        localStorage.setItem('ethiccon_participants', JSON.stringify(participants));

        // Add Log
        const logs = JSON.parse(localStorage.getItem('ethiccon_logs') || '[]');
        logs.unshift({
            id: crypto.randomUUID(),
            message: `Portal Üzerinden Yeni Kayıt: ${pData.firstName} ${pData.lastName}`,
            type: 'info',
            user: 'Sistem (Portal)',
            timestamp: new Date().toISOString()
        });
        if (logs.length > 50) logs.pop();
        localStorage.setItem('ethiccon_logs', JSON.stringify(logs));

        // Show Success
        document.getElementById('formSection').style.display = 'none';
        document.getElementById('successSection').style.display = 'block';
    });
</script>
</body>
</html>
