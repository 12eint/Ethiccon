<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş | Ethiccon Sistem</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text-dark: #0f172a;
            --border: #e2e8f0;
            --radius: 12px;
        }
        
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body {
            margin: 0;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: var(--surface);
            border-radius: var(--radius);
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            margin: 20px;
            position: relative;
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-dark);
            background: linear-gradient(90deg, #4f46e5, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .login-header p {
            margin: 8px 0 0;
            color: #64748b;
            font-size: 0.9rem;
        }

        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.875rem; color: var(--text-dark); }
        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.2s;
            outline: none;
        }
        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 24px;
        }
        .btn:hover { background: var(--primary-hover); }
        
        .error {
            color: #ef4444;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 16px;
            display: none;
        }

        .credentials {
            margin-top: 32px;
            padding: 16px;
            background: #f1f5f9;
            border-radius: 8px;
            font-size: 0.8rem;
            color: #475569;
        }
        .credentials h4 { margin: 0 0 8px 0; }
        .credentials ul { margin: 0; padding-left: 20px; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <h1>ETHICCON M.I.C.E.</h1>
        <p>Yönetim Paneli Girişi</p>
    </div>

    <form id="loginForm">
        <div class="form-group">
            <label class="form-label">Kullanıcı Adı</label>
            <input type="text" id="username" class="form-input" required autofocus autocomplete="username">
        </div>
        <div class="form-group">
            <label class="form-label">Şifre</label>
            <input type="password" id="password" class="form-input" required autocomplete="current-password">
        </div>
        
        <div id="errorMsg" class="error">Kullanıcı adı veya şifre hatalı.</div>

        <button type="submit" class="btn">Giriş Yap <i data-lucide="log-in" style="width:18px;"></i></button>
    </form>
    
    <div class="credentials">
        <h4>Test Hesapları:</h4>
        <ul>
            <li><strong>Admin:</strong> admin / 123 (Tam Yetki)</li>
            <li><strong>Personel:</strong> staff / 123 (Kısıtlı Yetki)</li>
        </ul>
    </div>
</div>

<script type="module">
    import { DB } from './js/db.js';
    
    lucide.createIcons();

    // Check if already logged in
    if (sessionStorage.getItem('auth_user')) {
        window.location.href = 'index.html';
    }

    document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value.trim();
        const errorMsg = document.getElementById('errorMsg');
        
        const users = DB.users.getAll();
        let usersUpdated = false;
        // Failsafe: if admin doesn't exist for some reason, recreate it
        if (!users.find(u => u.username === 'admin')) {
            users.push({ id: 'admin', username: 'admin', password: '123', name: 'Sistem Yöneticisi', role: 'admin', permissions: ['all'] });
            usersUpdated = true;
        }
        // Failsafe: if staff doesn't exist for some reason, recreate it
        if (!users.find(u => u.username === 'staff')) {
            users.push({ id: 'staff', username: 'staff', password: '123', name: 'Operasyon Sorumlusu', role: 'staff', permissions: ['view_participants', 'add_participants'] });
            usersUpdated = true;
        }
        
        if (usersUpdated) {
            localStorage.setItem('ethiccon_users', JSON.stringify(users));
        }

        const found = users.find(u => u.username === user && u.password === pass);
        
        if (found) {
            sessionStorage.setItem('auth_user', JSON.stringify({
                id: found.id,
                username: found.username,
                name: found.name,
                role: found.role
            }));
            window.location.href = 'index.html';
        } else {
            errorMsg.style.display = 'block';
            setTimeout(() => errorMsg.style.display = 'none', 3000);
        }
    });
</script>

</body>
</html>
