<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ethiccon - Kongre Yönetim Sistemi</title>
  <meta name="description" content="Kongre, sempozyum ve etkinlik yönetim platformu">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  
  <!-- jsPDF & html2pdf -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <!-- Tom Select -->
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
  
  <!-- SheetJS (Excel) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-wrapper">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="content">
        <div class="page-loader" id="pageLoader">
          <div class="loader-spinner"></div>
        </div>
      </main>
    </div>
  </div>
  <div class="modal-overlay" id="modalOverlay"></div>
  <div class="toast-container" id="toastContainer"></div>
  
  <!-- Global Search (Spotlight) -->
  <div id="globalSearchOverlay" style="position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(8px); z-index: 9999; display: none; align-items: flex-start; justify-content: center; padding-top: 10vh; opacity: 0; transition: opacity 0.2s ease;">
    <div style="background: var(--bg-secondary); width: 90%; max-width: 600px; border-radius: var(--radius-lg); box-shadow: var(--shadow-xl); overflow: hidden; display: flex; flex-direction: column;">
      <div style="display: flex; align-items: center; padding: 16px 24px; border-bottom: 1px solid var(--slate-100);">
        <i data-lucide="search" style="color: var(--slate-400); width: 24px; height: 24px;"></i>
        <input type="text" id="globalSearchInput" placeholder="Misafir, firma, etkinlik veya menü ara... (ESC ile çık)" style="flex: 1; border: none; outline: none; font-size: 1.125rem; background: transparent; padding: 0 16px; color: var(--slate-800);">
        <span style="font-size: 0.75rem; background: var(--slate-100); color: var(--slate-500); padding: 4px 8px; border-radius: var(--radius-sm); font-weight: 600;">ESC</span>
      </div>
      <div id="globalSearchResults" style="max-height: 400px; overflow-y: auto; padding: 12px; display: none;">
        <!-- Results injected via JS -->
      </div>
      <div id="globalSearchEmpty" style="padding: 32px; text-align: center; color: var(--slate-400); display: flex; flex-direction: column; align-items: center; gap: 12px;">
        <i data-lucide="command" style="width: 32px; height: 32px; opacity: 0.5;"></i>
        <p style="margin:0; font-size: 0.9rem;">Ne aramak istersiniz? Hızlı erişim için yazmaya başlayın.</p>
      </div>
    </div>
  </div>
  
  <script type="module" src="js/app.js"></script>
</body>
</html>
